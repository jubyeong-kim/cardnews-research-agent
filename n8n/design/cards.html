<meta charset="utf-8">
<title>카드뉴스 시안 — 실행 46</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  /* 팔레트는 여기 한 곳만 바꾸면 전체가 따라옵니다. */
  :root {
    --ink:    #14202E;   /* 표지·마무리 바탕, 본문 글자 */
    --cream:  #F7F3EC;   /* 본문 카드 바탕 */
    --accent: #E8663C;   /* 강조 한 색만 */
    --muted:  #7C8794;   /* 출처·보조 */

    --card-w: 1080px;
    --card-h: 1350px;    /* 인스타 4:5 */
    --pad:    96px;
  }

  body { background: #2A2F36; color: #E7E9EC; font-family: 'Noto Sans KR', sans-serif; padding: 32px; }
  h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #9AA3AD; margin: 0 0 28px; line-height: 1.7; }
  .sub b { color: #E7E9EC; }

  .grid { display: flex; flex-wrap: wrap; gap: 28px; }
  .slot { width: 360px; }
  .label { font-size: 12px; color: #9AA3AD; margin-bottom: 8px; letter-spacing: .04em; }

  /* 카드는 항상 1080×1350 으로 그리고, 보기용으로만 축소합니다.
     내보낼 때 이 축소만 빼면 실제 크기 그대로 나옵니다. */
  .frame { width: 360px; height: 450px; overflow: hidden; border-radius: 10px; }
  .card {
    width: var(--card-w); height: var(--card-h);
    transform: scale(0.33333); transform-origin: top left;
    box-sizing: border-box; padding: var(--pad);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }

  /* ---- 표지 / 마무리 : 어두운 면 ---- */
  .card.dark { background: var(--ink); color: var(--cream); }
  .card.dark .kicker { font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
  .card.dark .headline { font-size: 96px; font-weight: 900; line-height: 1.22; margin-top: auto; letter-spacing: -.02em; }
  .card.dark .lede { font-size: 34px; line-height: 1.65; color: #C3CCD6; margin-top: 36px; }
  .card.dark .rule { width: 132px; height: 8px; background: var(--accent); margin: 44px 0 0; }

  /* ---- 본문 : 밝은 면 ---- */
  .card.light { background: var(--cream); color: var(--ink); }
  .card.light .idx {
    position: absolute; right: 56px; top: 28px;
    font-size: 240px; font-weight: 900; color: var(--ink); opacity: .07; line-height: 1;
  }
  .card.light .tag { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
  .card.light .title { font-size: 62px; font-weight: 900; line-height: 1.28; margin: 22px 0 0; letter-spacing: -.02em; }
  .card.light .title-rule { width: 96px; height: 6px; background: var(--ink); margin: 32px 0 36px; }
  .card.light .body { font-size: 34px; line-height: 1.72; color: #2C3A4B; }

  /* 출처를 카드 안에 남깁니다. 근거를 따져 만든 원고라 화면에서도 보이는 게 맞습니다. */
  .src { margin-top: auto; padding-top: 28px; font-size: 21px; line-height: 1.5; color: var(--muted);
         border-top: 2px solid rgba(124,135,148,.28); word-break: break-all; }
  .card.dark .src { color: #7E8A98; border-top-color: rgba(126,138,152,.3); }

  .over { color: #E8663C; font-weight: 700; }
</style>

<h1>카드뉴스 시안 — 실행 46 「오사카 기념품 추천」</h1>
<p class="sub">
  1080×1350 (인스타 4:5) · 실제 크기로 그린 뒤 보기용으로만 1/3 축소했습니다.<br>
  <b>사진은 한 장도 안 씁니다</b> — 남의 제품컷 권리 문제를 피하는 가장 확실한 방법이고, 우리 사진이 아직 없습니다.<br>
  <b>출처를 카드 안에 남깁니다</b> — 근거를 따져 만든 원고라 화면에도 보이는 게 맞다고 봤습니다.
</p>

<div class="grid" id="grid"></div>

<script>
// 실행 46 의 storyboard.json 을 그대로 옮긴 것입니다.
// 자동화할 때는 이 배열만 그 파일로 갈아끼우면 됩니다.
const CARDS = [
  { no: 1, role: '표지', title: '오사카 마지막 날,\n뭐 사갈지 고민이라면',
    body: "간사이공항·백화점에서 '나눠주기 좋은' 오사카 기념품만 골랐어요. 개별포장·가성비 위주로 정리 →",
    source: '해당 없음' },
  { no: 2, role: '본문', title: '1,000엔대\n명품 손수건',
    body: '오사카 다이마루 백화점 1층 잡화 코너에서 유명 브랜드 손수건을 1,000엔대에 살 수 있어요. 영상에서는 남성 BOSS·DAKS, 여성 랑방·케이트 스페이드를 추천하고, 치이카와·포켓몬 손수건도 언급돼요.',
    source: 'youtube.com/watch?v=MAvBXS5ND40 [00:00]' },
  { no: 3, role: '본문', title: "딸기 파이\n'하카타 파이오'",
    body: '제리스텔라 블로그 후기에 따르면, 간사이공항 면세 코너에서 산 하카타 파이오는 후쿠오카산 아마오 딸기를 넣은 파이 과자예요. 하나씩 개별포장이라 회사·친구에게 돌리기 좋다고 해요.',
    source: 'blog.naver.com/psyche99 · 블로그 기준 16개입 1,200엔' },
  { no: 4, role: '본문', title: '톡톡 씹히는\n딸기 카스테라',
    body: '같은 블로그 후기 기준, 푸치푸치 카스테라는 핑크빛 딸기 카스테라 속에 딸기씨 같은 작은 알갱이가 톡톡 씹히는 게 포인트예요. 부드러운 빵 식감과 아마오 딸기의 은은한 단맛이 함께라 선물 반응이 좋았다고 해요.',
    source: 'blog.naver.com/psyche99 · 블로그 기준 230g 1,450엔' },
  { no: 5, role: '본문', title: "3가지 식감\n'오사카 치즈 브륄레'",
    body: '제조사 감수 매체 GOOD LUCK TRIP에 따르면, 별첨 캐러멜 크래시를 뿌려 완성하는 2단 치즈 케이크로 폭신·걸쭉·바삭 세 가지 식감을 한 번에 즐길 수 있어요.',
    source: 'gltjp.com/ko/article/item/21086' },
  { no: 6, role: '본문', title: '어디서 사요?\n간사이공항 제1터미널',
    body: "국제선 면세구역 'TASTE OF JAPAN 간사이 타비닛키'에서 로이즈·시로이코이비토 같은 익숙한 과자부터 간사이 한정 기념품까지 한 번에 볼 수 있어요. 손수건은 시내 다이마루에서, 과자류는 출국 직전 공항에서 담는 동선이 편해요.",
    source: 'kansai-airport.or.jp/kr/shop-and-dine/shop' },
  { no: 7, role: '마무리', title: '저장하고\n출국 전에 꺼내보기',
    body: '손수건·딸기 과자·치즈 브륄레까지 공항 한 곳에서 거의 해결돼요. 캐리어 무게 걱정된다면 개별포장 위주로 담아보세요 👜',
    source: '해당 없음' },
];

// 인스타 카드에서 편하게 읽히는 한계선. 넘으면 눈에 보이게 표시합니다 —
// 원고 단계에서 줄여야 할 일이지 디자인에서 줄일 일이 아닙니다.
const BODY_LIMIT = 120;

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const nl = s => esc(s).replace(/\n/g, '<br>');

document.getElementById('grid').innerHTML = CARDS.map(c => {
  const dark = c.role === '표지' || c.role === '마무리';
  const over = c.body.length > BODY_LIMIT;
  const src = c.source === '해당 없음' ? '' : '<div class="src">출처 ' + esc(c.source) + '</div>';

  const inner = dark
    ? '<div class="kicker">' + esc(c.role === '표지' ? '오사카 기념품' : '오늘의 정리') + '</div>'
      + '<div class="headline">' + nl(c.title) + '</div>'
      + '<div class="rule"></div>'
      + '<div class="lede">' + nl(c.body) + '</div>'
      + (src || '<div style="margin-top:auto"></div>')
    : '<div class="idx">' + String(c.no - 1).padStart(2, '0') + '</div>'
      + '<div class="tag">기념품 ' + String(c.no - 1).padStart(2, '0') + '</div>'
      + '<div class="title">' + nl(c.title) + '</div>'
      + '<div class="title-rule"></div>'
      + '<div class="body">' + nl(c.body) + '</div>'
      + src;

  return '<div class="slot">'
    + '<div class="label">' + c.no + '. ' + esc(c.role)
    + ' · 본문 ' + c.body.length + '자'
    + (over ? ' <span class="over">← ' + BODY_LIMIT + '자 넘음</span>' : '')
    + '</div>'
    + '<div class="frame"><div class="card ' + (dark ? 'dark' : 'light') + '">' + inner + '</div></div>'
    + '</div>';
}).join('');
</script>
